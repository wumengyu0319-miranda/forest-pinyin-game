<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>森林里的拼音宝宝</title>
<style>
:root{--bg:#eaf3fb;--ink:#1d2a38;--soft:#5b6f84;--card:#fff;--line:#7f93a8;--sm:#2c6fb7;--ym:#d4453c;--zt:#25975a;--on:#fff;--gold:#f2b01e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202c;--ink:#eaf1f8;--soft:#9db0c3;--card:#1e2d3c;--line:#8aa0b6;--sm:#4f93da;--ym:#ec6a61;--zt:#3fbf7c;--on:#0e1722}}
:root[data-theme="dark"]{--bg:#14202c;--ink:#eaf1f8;--soft:#9db0c3;--card:#1e2d3c;--line:#8aa0b6;--sm:#4f93da;--ym:#ec6a61;--zt:#3fbf7c;--on:#0e1722}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;display:flex;justify-content:center;min-height:100%}
main{width:100%;max-width:520px;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;position:relative}
h1{font-size:28px;margin:2px 0 0}
p{margin:0;line-height:1.6}
.soft{color:var(--soft);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.snd{border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:20px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.track{position:relative;height:34px;border-bottom:4px dashed var(--line);margin:0 6px}
.snail{position:absolute;bottom:-4px;font-size:28px;transition:left .5s ease}
.flag{position:absolute;right:-6px;bottom:2px;font-size:26px}
.chips2{display:flex;justify-content:space-between;font-size:15px;color:var(--soft)}
#combo{color:var(--ym);font-weight:700}
.stage{position:relative;aspect-ratio:12/5}
.grid{position:absolute;inset:0;background:var(--card);border-radius:18px;border:2px solid var(--line);overflow:hidden;will-change:transform}
.grid i{position:absolute;left:0;right:0;border-top:2px solid var(--line)}
.grid i.d{border-top:2px dashed var(--line);opacity:.7}
.grid b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:700;letter-spacing:2px;font-family:"Segoe Print","Comic Sans MS","Arial Rounded MT Bold",sans-serif}
.grid.ok{outline:5px solid var(--zt)}
.grid.no{outline:5px solid var(--ym)}
@media (prefers-reduced-motion:no-preference){
 .grid.drop{animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
 @keyframes drop{from{transform:translateY(-90px) rotate(-6deg);opacity:0}}
 .grid.no{animation:sh .35s}
 @keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
 .house.yay .em{animation:yay .6s}
 @keyframes yay{30%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(1.3) rotate(10deg)}}
 .house.hint{animation:glow 1s infinite alternate}
 @keyframes glow{to{transform:translateY(-6px)}}
 .fall{position:fixed;top:-30px;font-size:28px;animation:fall 1.8s ease-in forwards;pointer-events:none;z-index:9}
 @keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
 .pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
 @keyframes pop{from{transform:scale(.2)}}
}
.say{display:flex;gap:10px;align-items:center;min-height:64px}
.mas{font-size:44px;line-height:1}
#msg{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.5;flex:1}
.houses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.house{border:0;border-radius:20px 20px 10px 10px;color:var(--on);padding:12px 4px 12px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:116px;position:relative;text-align:center}
.house small{font-size:12px;font-weight:400;opacity:.95;line-height:1.3}
.em{font-size:38px;line-height:1.1}
.house:focus-visible,.btn:focus-visible,.snd:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.house.sm{background:var(--sm)}.house.ym{background:var(--ym)}.house.zt{background:var(--zt)}
.house.hint{outline:5px solid var(--gold);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn.main{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;color:var(--on);font-size:18px;font-weight:700}
.stars{font-size:44px;text-align:center;color:var(--gold)}
.shelf{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.shelf span{background:var(--card);border:2px solid var(--line);border-radius:12px;text-align:center;font-size:24px;padding:6px 0}
.shelf span.no{opacity:.5;font-size:18px;padding:9px 0}
.newst{text-align:center;font-size:70px}
[hidden]{display:none!important}

.scene{position:relative;border-radius:20px;overflow:hidden;padding:12px 12px 0;border:2px solid var(--line);background:#8dd0fa}
.scene .stage{width:100%}
.ground{position:relative;height:58px;margin:10px -12px 0;background:linear-gradient(#5aa05a,#3d7a43)}
.tree{position:absolute;bottom:26px;font-size:34px}
.boy{position:absolute;bottom:6px;font-size:36px;transition:left .6s ease}
.baby{position:absolute;left:8px;top:6px;font-size:26px;z-index:2}
.fire{position:absolute;opacity:0;font-size:16px;transition:opacity 1.2s;pointer-events:none}
.night .fire{opacity:1}
@media (prefers-reduced-motion:no-preference){.night .fire{animation:fl 3s ease-in-out infinite alternate}@keyframes fl{to{transform:translate(10px,-12px)}}.boy.walk{animation:wk .5s}@keyframes wk{40%{transform:translateY(-8px)}}}
.big{font-size:76px;text-align:center;line-height:1.2;padding:26px 0;background:var(--card);border:2px solid var(--line);border-radius:20px}
.link{background:none;border:0;color:var(--soft);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}
</style>
</head>
<body>
<main>
<section id="start" class="row">
  <div class="top"><h1>森林里的拼音宝宝</h1><button class="snd" id="snd1" aria-label="声音开关">🔊</button></div>
  <p>小探险家走进大森林，发现好多拼音宝宝迷路了。帮它们找到自己的小屋，送它们回家吧！</p>
  <div class="houses">
    <div class="house sm"><span class="em">🍄</span>蘑菇屋<small>声母 · 小伙伴<br>23 个</small></div>
    <div class="house ym"><span class="em">🌳</span>大树屋<small>韵母 · 大嗓门<br>6 个</small></div>
    <div class="house zt"><span class="em">⛺</span>帐篷<small>整体认读<br>一家人不拆开<br>10 个</small></div>
  </div>
  <button class="btn main" data-mode="all" data-story="1">开始探险！送 10 个宝宝</button>
  <button class="btn" data-mode="zt" data-story="1">重点送整体认读宝宝</button>
  <p><b>我的森林徽章</b> <span class="soft" id="stcount"></span></p>
  <div class="shelf" id="shelf"></div>
  <p class="soft">送对 7 个以上，就能得到一枚新徽章。</p>
</section>

<section id="story" class="row" hidden>
  <div class="big" id="sbig"></div>
  <p id="stext" style="font-size:18px"></p>
  <button class="btn main" id="snext">继续</button>
  <button class="link" id="sskip">跳过故事</button>
</section>

<section id="play" class="row" hidden>
  <div class="top"><div class="chips2" style="flex:1"><span id="prog">1 / 10</span><span id="combo"></span></div><button class="snd" id="snd2" aria-label="声音开关">🔊</button></div>
  <div class="scene" id="scene">
    <span class="fire" style="left:10%;top:18%">✨</span><span class="fire" style="left:80%;top:12%;animation-delay:.7s">✨</span><span class="fire" style="left:55%;top:60%;animation-delay:1.3s">✨</span><span class="fire" style="left:25%;top:70%;animation-delay:.3s">✨</span>
    <div class="stage"><div class="grid" id="card"><span class="baby" id="baby">🥺</span><svg viewBox="0 0 480 200" width="100%" height="100%" style="color:var(--ink);display:block" aria-hidden="true"><g stroke="var(--line)" stroke-width="2.5"><line x1="0" y1="25" x2="480" y2="25"/><line x1="0" y1="175" x2="480" y2="175"/><g stroke-dasharray="6 5" opacity=".85"><line x1="0" y1="75" x2="480" y2="75"/><line x1="0" y1="125" x2="480" y2="125"/><line x1="160" y1="25" x2="160" y2="175"/><line x1="320" y1="25" x2="320" y2="175"/></g></g><g id="pyg"></g></svg></div></div>
    <div class="ground"><span class="tree" style="left:6%">🌲</span><span class="tree" style="left:27%">🌳</span><span class="tree" style="left:48%">🌲</span><span class="tree" style="left:69%">🌳</span><span class="tree" style="left:90%">🌲</span><span class="boy" id="boy">👦</span></div>
  </div>
  <div class="say"><span class="mas" id="mas">👦</span><p id="msg"></p></div>
  <div class="houses">
    <button class="house sm" data-k="sm"><span class="em">🍄</span>蘑菇屋<small>声母</small></button>
    <button class="house ym" data-k="ym"><span class="em">🌳</span>大树屋<small>韵母</small></button>
    <button class="house zt" data-k="zt"><span class="em">⛺</span>帐篷<small>整体认读</small></button>
  </div>
</section>

<section id="end" class="row" hidden>
  <h1 id="endTitle">拼音宝宝都回家啦！</h1>
  <div class="stars" id="stars"></div>
  <p id="endText"></p>
  <div id="newst" class="newst" hidden></div>
  <p id="newtxt" class="soft" style="text-align:center"></p>
  <div class="chips" id="wrongs"></div>
  <p class="soft" id="parent"></p>
  <button class="btn main" data-mode="all">再送 10 个宝宝</button>
  <button class="btn" data-mode="zt">重点送整体认读宝宝</button>
  <button class="btn" id="home">回到首页看徽章</button>
</section>
</main>
<script>
var SM="b p m f d t n l g k h j q x zh ch sh r z c s y w".split(" ");
var YM="a o e i u ü".split(" ");
var ZT="zhi chi shi ri zi ci si yi wu yu".split(" ");
var KIND={},NAME={sm:"声母",ym:"韵母",zt:"整体认读"};
SM.forEach(function(x){KIND[x]="sm"});YM.forEach(function(x){KIND[x]="ym"});ZT.forEach(function(x){KIND[x]="zt"});
var HINT={
 sm:function(x){return x+" 是声母，是小伙伴，要和韵母一起才响亮。"},
 ym:function(x){return x+" 是韵母，是大嗓门，自己就能响亮。"},
 zt:function(x){return x+" 是整体认读，一家人不拆开，整个读，不用拼。"}
};
var STK=["🍄","🦉","🦋","🐿️","🦊","🐻","🌈","🏅"];
var store={};
try{store=JSON.parse(localStorage.getItem("pyzj")||"{}")}catch(e){store={}}
if(!store.st)store.st=[];
function save(){try{localStorage.setItem("pyzj",JSON.stringify(store))}catch(e){}}
function $(id){return document.getElementById(id)}
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* sound */
var muted=false,ac=null;
function beep(notes){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach(function(n,k){
      var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+k*0.12;
      o.type="triangle";o.frequency.value=n;g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.25);
    });
  }catch(e){}
}
function toggleSnd(){muted=!muted;$("snd1").textContent=$("snd2").textContent=muted?"🔇":"🔊"}
$("snd1").onclick=toggleSnd;$("snd2").onclick=toggleSnd;
/* confetti */
function confetti(n){
  if(reduce)return;
  var set=["🎉","⭐","✨","🎈","🌟"];
  for(var k=0;k<n;k++){
    var s=document.createElement("span");s.className="fall";s.textContent=set[k%set.length];
    s.style.left=(Math.random()*95)+"vw";s.style.animationDelay=(Math.random()*0.6)+"s";
    document.body.appendChild(s);(function(el){setTimeout(function(){el.remove()},2600)})(s);
  }
}
/* picking */
function wpick(pool,n){
  var items=pool.slice(),out=[];
  while(out.length<n&&items.length){
    var w=items.map(function(x){return 1+2*(store[x]||0)}),t=w.reduce(function(a,b){return a+b},0),r=Math.random()*t,i=0;
    while(r>w[i]){r-=w[i];i++}
    out.push(items.splice(i,1)[0]);
  }
  return out;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
/* shelf */
function shelf(){
  var h="";STK.forEach(function(s,k){h+=store.st.indexOf(k)>=0?"<span>"+s+"</span>":'<span class="no">❔</span>'});
  $("shelf").innerHTML=h;$("stcount").textContent=store.st.length+" / "+STK.length;
}
/* four-line grid letters: baseline u=0 (line 3), x-height 10 units (middle space), ascender to -19 (top space), descender to +9 (bottom space) */
var BW="M8 -5A3.5 4.5 0 1 0 1 -5A3.5 4.5 0 1 0 8 -5",OV="M7.5 -5A3.5 4.5 0 1 0 0.5 -5A3.5 4.5 0 1 0 7.5 -5";
var G={
a:{w:8,d:OV+"M7.5 -10L7.5 0"},
b:{w:9,d:"M1 -16L1 0"+BW},
c:{w:8,d:"M6.68 -7.89A3.5 4.5 0 1 0 6.68 -2.11"},
d:{w:9,d:"M8 -16L8 0"+BW},
e:{w:8,d:"M0.5 -5L7.5 -5A3.5 4.5 0 1 0 6.68 -2.11"},
f:{w:8,d:"M7.5 -18.5C5 -16.5 3 -18 3 -15L3 7M0 -10L7 -10"},
g:{w:8,d:OV+"M7.5 -10L7.5 3C7.5 6.5 3 7.5 0.5 6.5"},
h:{w:8.5,d:"M1 -16L1 0M1 -6C2 -10.5 7.5 -10.5 7.5 -5L7.5 0"},
i:{w:4,d:"M2 -10L2 0",dots:[[2,-13]]},
j:{w:5,d:"M3 -10L3 4.5C3 7 1.5 7.5 0 7",dots:[[3,-13]]},
k:{w:8,d:"M1 -16L1 0M7.5 -10L1 -4M3 -5.8L7.5 0"},
l:{w:4,d:"M2 -16L2 0"},
m:{w:12,d:"M1 -10L1 0M1 -6C1.5 -10.5 6 -10.5 6 -5L6 0M6 -5.5C6.5 -10.5 11 -10.5 11 -5L11 0"},
n:{w:8.5,d:"M1 -10L1 0M1 -6C2 -10.5 7.5 -10.5 7.5 -5L7.5 0"},
o:{w:8,d:OV},
p:{w:9,d:"M1 -10L1 7"+BW},
q:{w:9,d:"M8 -10L8 7"+BW},
r:{w:7,d:"M1 -10L1 0M1 -6C1.5 -9.5 4 -10.5 6 -9.5"},
s:{w:8,d:"M7 -8.5C5 -11 1 -10 1.5 -7C2 -5 7 -5.5 7 -2.5C6.5 0.5 2 0.5 0.5 -2"},
t:{w:8,d:"M3 -16L3 -2C3 0 5 0.5 7 -0.5M0.5 -10L6 -10"},
u:{w:8.5,d:"M1 -10L1 -3C1 1.5 6.5 1.5 7.5 -3M7.5 -10L7.5 0"},
w:{w:11,d:"M0.5 -10L2.5 0L5.5 -8L8.5 0L10.5 -10"},
x:{w:8.5,d:"M1 -10L7.5 0M7.5 -10L1 0"},
y:{w:8,d:"M1 -10L4 0M7.5 -10L3.5 4.5C2.8 6.5 1.5 7.5 0 7"},
z:{w:8.5,d:"M1 -10L7.5 -10L1 0L7.5 0"},
"ü":{w:8.5,d:"M1 -10L1 -3C1 1.5 6.5 1.5 7.5 -3M7.5 -10L7.5 0",dots:[[2.5,-13],[6,-13]]}
};
function build(s){
  var tot=0,x=0,h="",i;
  for(i=0;i<s.length;i++)tot+=G[s[i]].w+(i?1.5:0);
  for(i=0;i<s.length;i++){
    var g=G[s[i]];h+='<g transform="translate('+x+' 0)"><path d="'+g.d+'"/>';
    (g.dots||[]).forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="0.95" fill="currentColor" stroke="none"/>'});
    h+='</g>';x+=g.w+1.5;
  }
  return '<g transform="translate('+(240-tot*2.5)+' 125) scale(5)" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">'+h+'</g>';
}

var q=[],i=0,right=0,wrongs=[],learn=false,locked=false,cur="",streak=0,pend="all",sp=0;
var PANELS=[["🌲👦🎒","周末，小探险家背起背包，走进了神秘的大森林。"],["🥺🥺🥺","咦？树丛里传来哭声。原来是一群拼音宝宝，迷路啦！"],["🍄🌳⛺","森林里有三间小屋：蘑菇屋住声母，大树屋住韵母，帐篷住整体认读。帮宝宝们找到自己的家吧！"]];
var NARR={0:"森林好安静……咦，前面有个拼音宝宝在哭！",3:"过了小溪，又有宝宝迷路了！",6:"天色暗下来，萤火虫亮起来啦，快送宝宝们回家！",9:"最后一个宝宝！送完我们就能回营地了。"};
var PRAISE={3:"连对 3 个，探险家真棒！",5:"连对 5 个，太厉害啦！",8:"连对 8 个，整个森林都在为你鼓掌！"};
function storyShow(){$("sbig").textContent=PANELS[sp][0];$("stext").textContent=PANELS[sp][1];$("snext").textContent=sp===PANELS.length-1?"出发！":"继续"}
function startStory(m){pend=m;sp=0;$("start").hidden=true;$("end").hidden=true;$("story").hidden=false;storyShow()}
$("snext").onclick=function(){beep([440]);if(sp<PANELS.length-1){sp++;storyShow()}else start(pend)};
$("sskip").onclick=function(){start(pend)};
function start(mode){
  var all=SM.concat(YM,ZT);
  if(mode==="zt"){var z=wpick(ZT,6);q=z.concat(wpick(all.filter(function(x){return z.indexOf(x)<0}),4))}
  else q=wpick(all,10);
  shuffle(q);i=0;right=0;wrongs=[];streak=0;
  $("start").hidden=true;$("end").hidden=true;$("story").hidden=true;$("play").hidden=false;show();
}
function mix(a,b,p){return a.map(function(v,k){return Math.round(v+(b[k]-v)*p)})}
function sky(p){
  var t=mix([141,208,250],[84,58,120],p),b=mix([170,228,160],[236,150,104],p);
  $("scene").style.background="linear-gradient(rgb("+t+"),rgb("+b+"))";$("scene").classList.toggle("night",p>=0.55);
}
function setBoy(p){var b=$("boy");b.style.left=p+"%";b.style.transform="translateX(-"+p+"%)";b.classList.remove("walk");void b.offsetWidth;b.classList.add("walk")}
function show(){
  cur=q[i];learn=false;locked=false;
  var c=$("card");c.style.transition="none";c.style.transform="";c.style.opacity="1";
  c.className="grid";void c.offsetWidth;c.className="grid drop";
  $("pyg").innerHTML=build(cur);$("baby").textContent="🥺";
  $("prog").textContent=(i+1)+" / "+q.length;
  $("combo").textContent=streak>=2?"🔥 连对 "+streak:"";
  $("mas").textContent="👦";
  $("msg").textContent=(NARR[i]||"又发现一个迷路的拼音宝宝！")+" 它住哪间小屋？";
  sky(i/q.length);
  document.querySelectorAll("#play .house").forEach(function(h){h.classList.remove("hint","yay")});
}
function next(){i++;if(i>=q.length)finish();else show()}
function fly(k){
  var c=$("card"),h=document.querySelector('#play .house[data-k="'+k+'"]');
  if(reduce){c.style.transition="opacity .3s";c.style.opacity="0";return}
  var a=c.getBoundingClientRect(),b=h.getBoundingClientRect();
  var dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);
  c.className="grid";c.style.transition="transform .5s ease-in,opacity .5s";
  c.style.transform="translate("+dx+"px,"+dy+"px) scale(.15)";c.style.opacity="0";
}
function answer(k){
  if(locked)return;
  var ok=k===KIND[cur],hs=document.querySelector('#play .house[data-k="'+KIND[cur]+'"]');
  if(learn){if(ok){beep([660]);next()}else $("msg").textContent="宝宝还在哭，找找亮着的那间小屋。";return}
  if(ok){
    right++;streak++;locked=true;
    $("card").className="grid ok";$("mas").textContent="🥳";$("baby").textContent="😊";
    $("msg").textContent=(PRAISE[streak]||"谢谢你，探险家！")+" "+HINT[k](cur);
    $("combo").textContent=streak>=2?"🔥 连对 "+streak:"";
    setBoy((i+1)/q.length*100);
    hs.classList.add("yay");beep([523,659,784]);
    if(PRAISE[streak])confetti(14);
    setTimeout(function(){fly(k)},350);
    setTimeout(next,1500);
  }else{
    streak=0;$("combo").textContent="";
    wrongs.push(cur);store[cur]=(store[cur]||0)+1;save();
    $("card").className="grid no";$("mas").textContent="🤔";$("baby").textContent="😢";beep([220]);
    $("msg").textContent="宝宝走错门啦。"+HINT[KIND[cur]](cur)+" 点亮着的小屋，再送一次。";
    hs.classList.add("hint");learn=true;
  }
}
function finish(){
  $("play").hidden=true;$("end").hidden=false;
  var s=right>=9?3:right>=7?2:1;
  $("stars").textContent="★★★".slice(0,s)+"☆☆☆".slice(0,3-s);
  $("endTitle").textContent=right===q.length?"全部送对了！森林欢呼啦！":"拼音宝宝都回家啦！";
  $("endText").textContent="森林里响起欢呼声，萤火虫围着小探险家转圈圈。一共 "+q.length+" 个宝宝，一次就送对了 "+right+" 个。";
  var ns=$("newst");ns.hidden=true;$("newtxt").textContent="";
  if(right>=7){
    var left=[];STK.forEach(function(x,k){if(store.st.indexOf(k)<0)left.push(k)});
    if(left.length){var g=left[Math.floor(Math.random()*left.length)];store.st.push(g);save();
      ns.textContent=STK[g];ns.hidden=false;ns.className="newst pop";$("newtxt").textContent="森林送你一枚新徽章！";}
    else $("newtxt").textContent="森林徽章已经集齐啦！";
    confetti(26);beep([523,659,784,1047]);
  }
  var box=$("wrongs");box.innerHTML="";
  wrongs.forEach(function(w){
    var c=document.createElement("span");c.className="chip";c.style.background="var(--"+KIND[w]+")";
    c.textContent=w+"（"+NAME[KIND[w]]+"）";box.appendChild(c);
  });
  $("parent").textContent=wrongs.length?"家长：上面是走错门的宝宝，写进弱项记录表。这些字明天会更容易再出现。":"家长：明天再玩一局，答错过的字会更容易再出现。";
}
function home(){$("end").hidden=true;$("play").hidden=true;$("start").hidden=false;shelf()}
document.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){if(b.dataset.story)startStory(b.dataset.mode);else start(b.dataset.mode)})});
document.querySelectorAll("#play .house").forEach(function(h){h.addEventListener("click",function(){answer(h.dataset.k)})});
$("home").onclick=home;
shelf();
</script>
</body>
</html>
